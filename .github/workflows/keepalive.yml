name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the room function
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is not set"; exit 1; }
          # A view of a room that does not exist reads the database and answers 404, which counts as activity.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/functions/v1/room" \
            -H 'content-type: application/json' -H "apikey: $SUPABASE_ANON_KEY" \
            -d '{"action":"view","code":"ZZZZ","token":"keepalive"}')
          echo "room function answered $status"
          [ "$status" = 404 ] || [ "$status" = 200 ] || { echo "::error::unexpected status $status (is the project paused?)"; exit 1; }
